 <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-CHAT</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --bg: #0e1621; --side: #17212b; --text: #ffffff;
            --msg: #2ecc71; --input: #242f3d; --border: rgba(255,255,255,0.1);
        }
        .light-mode {
            --bg: #f0f2f5; --side: #ffffff; --text: #000000;
            --msg: #0088cc; --input: #ffffff; --border: rgba(0,0,0,0.1);
        }

        body {
            margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg); color: var(--text);
            transition: background 0.3s, color 0.3s; height: 100vh; overflow: hidden;
        }
        #app-root { display: flex; height: 100%; width: 100%; }

        h1, h3, b, span, div, p, label { color: var(--text); transition: color 0.3s; }
       
        input {
            background: var(--input) !important; border: 1px solid var(--border);
            padding: 12px; border-radius: 12px; outline: none; color: var(--text) !important;
        }
        input::placeholder { color: var(--text); opacity: 0.4; }

        .sidebar { width: 320px; background: var(--side); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: relative; z-index: 10; transition: 0.3s; }
        .main-chat { flex: 1; display: flex; flex-direction: column; background: var(--bg); position: relative; transition: 0.3s; }
       
        .msg-bubble { align-self: flex-end; background: #2ecc71; color: white !important; padding: 10px 16px; border-radius: 18px; max-width: 85%; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.2); position: relative; }
        .msg-author { font-size: 10px; opacity: 0.8; display: block; margin-bottom: 2px; color: inherit; font-weight: bold; }
       
        .btn-green { background: #2ecc71 !important; color: white !important; padding: 14px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; border: none; transition: opacity 0.2s; }
        .btn-green:hover { opacity: 0.9; }
       
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-box { background: var(--side); padding: 30px; border-radius: 24px; width: 100%; max-width: 360px; border: 1px solid var(--border); text-align: center; }
       
        .chat-item { padding: 15px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.2s; }
        .chat-item:hover { background: rgba(255,255,255,0.05); }
        .chat-item.active { background: rgba(46, 204, 113, 0.2); border-left: 4px solid #2ecc71; }
       
        .lang-btn { padding: 6px 12px; border: 1px solid #2ecc71; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; color: #2ecc71 !important; }

        @media (max-width: 768px) {
            .sidebar { position: absolute; inset: 0; width: 100%; transform: translateX(0); }
            .main-chat { position: absolute; inset: 0; width: 100%; transform: translateX(100%); }
            body.chat-open .sidebar { transform: translateX(-100%); }
            body.chat-open .main-chat { transform: translateX(0); }
            .back-btn { display: block !important; }
        }
    </style>
</head>
<body>

<div id="app-root">
    <div id="auth-screen" style="position: fixed; inset: 0; background: #0e1621; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px;">
        <div style="background: #17212b; padding: 25px; border-radius: 30px; width: 100%; max-width: 340px; text-align: center;">
            <h1 style="color: #2ecc71 !important; font-size: 32px; font-weight: 900; margin-bottom: 15px;">Z-CHAT</h1>
            <div class="flex flex-col gap-2">
                <input type="text" id="regNick" placeholder="Никнейм">
                <input type="email" id="regEmail" placeholder="Email">
                <input type="password" id="regPass" placeholder="Пароль">
            </div>
            <button id="btnAuth" onclick="handleAuth()" class="btn-green uppercase mt-4 py-3">Регистрация</button>
            <p id="toggleAuth" onclick="toggleAuthMode()" class="mt-3 text-xs cursor-pointer" style="color: #2ecc71 !important;">Уже есть аккаунт? Войти</p>
           
            <div class="flex justify-center gap-4 mt-4 opacity-70">
                <span class="cursor-pointer text-xs font-bold" onclick="setLng('ru')">RU</span>
                <span class="cursor-pointer text-xs font-bold" onclick="setLng('ua')">UA</span>
                <span class="cursor-pointer text-xs font-bold" onclick="setLng('en')">EN</span>
            </div>
        </div>
    </div>

    <div class="sidebar">
        <div class="p-4 border-b border-[var(--border)]">
            <div class="flex items-center gap-3 mb-4">
                <button onclick="showM('setM')" style="font-size: 24px;">☰</button>
                <input type="text" id="searchBox" oninput="loadChats()" placeholder="Поиск..." class="flex-1">
            </div>
            <b id="t-chats">Чаты</b>
        </div>
        <div id="chatList" class="flex-1 overflow-y-auto"></div>
        <button onclick="showM('createM')" class="absolute bottom-6 right-6 w-14 h-14 bg-[#2ecc71] rounded-full text-white text-3xl shadow-xl">✎</button>
    </div>

    <div class="main-chat">
        <div class="p-4 border-b border-[var(--border)] flex justify-between items-center bg-[var(--side)]">
            <div class="flex items-center gap-3">
                <button onclick="closeChatMobile()" class="back-btn hidden text-2xl" style="color:#2ecc71 !important;">←</button>
                <b id="activeChatName">Выберите чат</b>
            </div>
        </div>
        <div id="box" class="flex-1 overflow-y-auto p-4 flex flex-col"></div>
        <div id="input-area" class="p-4 bg-[var(--side)] border-t border-[var(--border)]">
            <div id="no-chat-msg" class="text-center opacity-40 py-2">Выберите чат...</div>
            <div id="msg-controls" class="flex gap-3" style="display:none">
                <input type="text" id="msgIn" placeholder="Сообщение..." class="flex-1">
                <button onclick="sendMessage()" class="text-[#2ecc71] text-4xl">➤</button>
            </div>
        </div>
    </div>

    <div id="setM" class="modal" onclick="if(event.target==this) this.style.display='none'">
        <div class="modal-box">
            <h3 class="font-bold text-xl mb-6" id="t-set-head">Настройки</h3>
            <button onclick="toggleTheme()" class="btn-green mb-6" id="t-theme">СМЕНИТЬ ТЕМУ</button>
            <div class="flex justify-center gap-3 mb-8">
                <span class="lang-btn" onclick="setLng('ru')">RU</span>
                <span class="lang-btn" onclick="setLng('ua')">UA</span>
                <span class="lang-btn" onclick="setLng('en')">EN</span>
            </div>
            <button onclick="logoutAction()" id="t-exit-btn" class="w-full text-red-500 font-bold border-2 border-red-500 p-3 rounded-xl uppercase">Выйти</button>
        </div>
    </div>

    <div id="createM" class="modal" onclick="if(event.target==this) this.style.display='none'">
        <div class="modal-box space-y-4">
            <h3 id="t-create-head">Создать</h3>
            <button onclick="createChat('channel')" class="btn-green" id="t-btn-chan">📢 Канал</button>
            <button onclick="createChat('contact')" class="btn-green" style="background:#9b59b6 !important;" id="t-btn-cont">👤 Контакт</button>
        </div>
    </div>
</div>

<script>
    const S_URL = 'https://ifwmmbxpywugbsiqhexg.supabase.co';
    const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlmd21tYnhweXd1Z2JzaXFoZXhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1NTAxNzcsImV4cCI6MjA5MjEyNjE3N30.nrO5jrGvoiP_cUcv7VcXAtU5s0mXGxQDlw3a5CPVQaA';
    const sb = supabase.createClient(S_URL, S_KEY);

    // Установка режима регистрации по умолчанию
    let isLoginMode = false, currentChatId = null, currentLang = 'ru', me = null;

    const Langs = {
        ru: { fav: "Избранное", chats: "Чаты", set: "Настройки", theme: "СМЕНИТЬ ТЕМУ", create: "Создать", chan: "📢 Канал", cont: "👤 Контакт", msg: "Сообщение...", search: "Поиск...", exit: "Выйти", select: "Выберите чат...", nick: "Никнейм", reg: "Регистрация", enter: "Войти", have: "Уже есть аккаунт? Войти", noHave: "Нет аккаунта? Регистрация" },
        ua: { fav: "Обране", chats: "Чати", set: "Налаштування", theme: "ЗМІНИТИ ТЕМУ", create: "Створити", chan: "📢 Канал", cont: "👤 Контакт", msg: "Повідомлення...", search: "Пошук...", exit: "Вийти", select: "Оберіть чат...", nick: "Нікнейм", reg: "Реєстрація", enter: "Увійти", have: "Вже є акаунт? Увійти", noHave: "Немає акаунта? Реєстрація" },
        en: { fav: "Saved Messages", chats: "Chats", set: "Settings", theme: "SWITCH THEME", create: "Create", chan: "📢 Channel", cont: "👤 Contact", msg: "Message...", search: "Search...", exit: "Logout", select: "Select a chat...", nick: "Nickname", reg: "Register", enter: "Login", have: "Have account? Login", noHave: "No account? Register" }
    };

    function setLng(l) {
        currentLang = l; const d = Langs[l];
        const regNickInput = document.getElementById('regNick');
        if (regNickInput) regNickInput.placeholder = d.nick;
       
        document.getElementById('btnAuth').innerText = isLoginMode ? d.enter : d.reg;
        document.getElementById('toggleAuth').innerText = isLoginMode ? d.noHave : d.have;
        document.getElementById('t-chats').innerText = d.chats;
        document.getElementById('t-set-head').innerText = d.set;
        document.getElementById('t-theme').innerText = d.theme;
        document.getElementById('t-create-head').innerText = d.create;
        document.getElementById('t-btn-chan').innerText = d.chan;
        document.getElementById('t-btn-cont').innerText = d.cont;
        document.getElementById('msgIn').placeholder = d.msg;
        document.getElementById('searchBox').placeholder = d.search;
        document.getElementById('t-exit-btn').innerText = d.exit;
        document.getElementById('no-chat-msg').innerText = d.select;
        if(!currentChatId) document.getElementById('activeChatName').innerText = d.select;
    }

    async function handleAuth() {
        const email = document.getElementById('regEmail').value.trim();
        const pass = document.getElementById('regPass').value.trim();
        const nick = document.getElementById('regNick').value.trim();
        if(!email || !pass) return alert("Please fill all required fields!");

        if(isLoginMode) {
            const { error } = await sb.auth.signInWithPassword({ email, password: pass });
            if(error) alert(error.message);
        } else {
            const { data, error } = await sb.auth.signUp({ email, password: pass });
            if(error) return alert(error.message);
            if(data.user) {
                await sb.from('profiles').upsert([{ id: data.user.id, nickname: nick || email, email: email }]);
                alert("Registration successful! Now please login.");
                toggleAuthMode();
            }
        }
    }

    sb.auth.onAuthStateChange((event, session) => {  // ← no async
        if (event === 'SIGNED_IN') {
            me = session.user;
            document.getElementById('auth-screen').style.display = 'none';
            initializeAppOnLogin();  // ← no await here either
        } else if (event === 'SIGNED_OUT') {
            me = null;
            document.getElementById('auth-screen').style.display = 'flex';
            initializeAppOnLogin();  // ← no await here either
        }
    });

    (async () => {
        setLng('ru');
        const { data: { session } } = await sb.auth.getSession();
        // if (session) {
        //     me = session.user;
        //     document.getElementById('auth-screen').style.display = 'none';
        //     initializeAppOnLogin();  // ← no await here either
        // }
    })();

    async function initializeAppOnLogin() {
        if (!me) return;
        console.log("--- Starting App Initialization ---"); // <<< ADD THIS LOG
        await checkFavorites();
        console.log("✅ Favorites checked and updated."); // <<< ADD THIS LOG (If it succeeds)

        loadChats();
        console.log("✅ Chats loaded successfully."); // <<< ADD THIS LOG (If it succeeds)
    }

    async function checkFavorites() {
        if(!me) return;
        console.log("🌐 Running checkFavorites..."); // <<< ADD THIS LOG
        const { data } = await sb.from('chat_participants').select('chat_id, chats(type)').eq('user_id', me.id);
        console.log(data)
        const hasFav = data?.some(c => c.chats && c.chats.type === 'favorites');
        // if(!hasFav) {
        //     const { data: chat } = await sb.from('chats').insert([{ name: Langs[currentLang].fav, type: 'favorites' }]).select().single();
        //     if(chat) await sb.from('chat_participants').insert([{ chat_id: chat.id, user_id: me.id }]);
        // }
    }

    async function loadChats() {
        if(!me) return;
        const q = document.getElementById('searchBox').value.toLowerCase();
        const { data } = await sb.from('chat_participants').select('chat_id, chats(name, type)').eq('user_id', me.id);
        const list = document.getElementById('chatList');
        list.innerHTML = "";
        data?.forEach(item => {
            if(item.chats && item.chats.name.toLowerCase().includes(q)) {
                const d = document.createElement('div');
                d.className = "chat-item " + (currentChatId === item.chat_id ? "active" : "");
                const icon = item.chats.type === 'favorites' ? '🔖' : (item.chats.type === 'contact' ? '👤' : '💬');
                d.innerHTML = `<div class="w-10 h-10 bg-[#2ecc71] rounded-full flex items-center justify-center text-white">${icon}</div><b class="ml-2">${item.chats.name}</b>`;
                d.onclick = () => selectChat(item.chat_id, item.chats.name);
                list.appendChild(d);
            }
        });
    }

    function selectChat(id, name) {
        currentChatId = id;
        document.getElementById('activeChatName').innerText = name;
        document.getElementById('no-chat-msg').style.display = 'none';
        document.getElementById('msg-controls').style.display = 'flex';
        document.body.classList.add('chat-open');
        loadMessages();
    }

    async function sendMessage() {
        const inp = document.getElementById('msgIn');
        if(!inp.value.trim() || !currentChatId) return;
        await sb.from('messages').insert([{ chat_id: currentChatId, user_id: me.id, text: inp.value }]);
        inp.value = "";
        loadMessages();
    }

    async function loadMessages() {
        if(!currentChatId) return;
        const { data } = await sb.from('messages').select('*').eq('chat_id', currentChatId).order('created_at');
        const box = document.getElementById('box');
        box.innerHTML = (data || []).map(m => {
            const isMe = m.user_id === me.id;
            return `<div class="msg-bubble" style="${isMe ? '' : 'align-self: flex-start; background: var(--input);'}">
                <span class="msg-author">${m.profiles?.nickname || 'User'}</span>
                ${m.text}
            </div>`;
        }).join('');
        box.scrollTop = box.scrollHeight;
    }

    async function createChat(type) {
        if (!me) return alert("Please log in first.");

        const { data: currentUser, error: error } = await sb.from('profiles')
            .select('id, nickname')
            .eq('id', me.id)
            .single();
        console.log(currentUser)

        let name = "";
        let targetUserId = null; // Holds the UUID of the second participant

        try {
            if(type === 'contact') {
                const nickPrompt = prompt("Введите никнейм пользователя:");
                if(!nickPrompt) return;

                // 1. Find the Target User's ID (Requires a standard RLS SELECT policy on profiles)
                const { data: user, error: userError } = await sb.from('profiles')
                    .select('id, nickname')
                    .eq('nickname', nickPrompt)
                    .single();

                if(userError || !user) return alert("User not found or failed to retrieve ID.");

                targetUserId = user.id; // <<< Store the target UUID
                name = user.nickname + '&' + currentUser.nickname;
            } else {
                // Channel creation logic
                name = prompt("Название канала:");
                if(!name) return;
            }

            console.log(`Attempting to create ${type} chat: ${name}`);

            // *** CRITICAL CHANGE: CALL THE SECURE BACKEND FUNCTION ***
            const { data, error } = await sb.functions.invoke('create_chat', {
                body: { type: type, name: name, targetUserId: targetUserId }
            });

            if (error) {
                alert(`Error creating chat via backend: ${error.message}`);
                console.error(error);
                return;
            } else if (data && data.success) {
                // Success path
                document.getElementById('createM').style.display = 'none';
                setTimeout(() => {
                    alert(`${type === 'contact' ? 'Контакт' : 'Канал'} создан успешно!`);
                    loadChats(); // Reload chat list to show the new entry
                }, 500);
            } else {
                throw new Error("Unknown error returned from backend.");
            }

        } catch (err) {
            console.error("Error during createChat:", err);
            alert(`Failed to create chat: ${err.message}. Check the console for details.`);
        }
    }

    function toggleTheme() { document.body.classList.toggle('light-mode'); }
   
    function toggleAuthMode() {
        isLoginMode = !isLoginMode;
        document.getElementById('regNick').style.display = isLoginMode ? 'none' : 'block';
        setLng(currentLang);
    }

    function closeChatMobile() { document.body.classList.remove('chat-open'); }
   
    function showM(id) { document.getElementById(id).style.display = 'flex'; }
   
    // ИСПРАВЛЕННАЯ ФУНКЦИЯ ВЫХОДА (устраняет ошибку removedByCodePen)
    async function logoutAction() {
        await sb.auth.signOut();
        window.location.reload();
    }

    // Автообновление сообщений раз в 3 секунды
    setInterval(() => { if(currentChatId) loadMessages(); }, 3000);
   
    // Начальная инициализация
    setLng('ru');
</script>
</body>
</html>
